<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6470; --line:#e3e7ec; --brand:#0b57d0; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101317; --fg:#e8eaed; --muted:#9aa3ae; --line:#2a3038; --brand:#8ab4f8; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card { max-width: 560px; width: 100%; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 26px; border-radius: 16px;
    display: block; object-fit: cover;
  }
  .code { margin: 0; font-size: 13px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  h1 { margin: 10px 0 12px; font-size: 30px; line-height: 1.3; letter-spacing: -.01em; }
  p { margin: 0 0 8px; color: var(--muted); }
  .en { font-size: 14px; }
  a.button {
    display: inline-block; margin-top: 26px; padding: 11px 22px; border-radius: 999px;
    background: var(--brand); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
  }
  a.button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .plain { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .plain a { color: var(--brand); }
</style>
